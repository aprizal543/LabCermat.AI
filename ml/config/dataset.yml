# Azure ML Data Asset — Synthetic QC Anomaly Dataset
#
# Mendokumentasikan Data Asset yang diregister di Azure ML workspace.
#
# CARA REGISTER (jalankan dari Cloud Shell atau terminal dengan az login):
#
#   Opsi A — path dari file hasil job download (direkomendasikan):
#
#     az ml data create \
#       --name qc-anomaly-synthetic \
#       --version 1 \
#       --type uri_file \
#       --description "Synthetic QC anomaly dataset for LabCermat hackathon" \
#       --path ./job-downloads/named-outputs/dataset_dir/qc_synthetic.csv \
#       --resource-group rg-labcermat-ml-eastasia \
#       --workspace-name mlw-labcermat
#
#   Opsi B — langsung dari output job (tanpa download):
#
#     az ml data create \
#       --name qc-anomaly-synthetic \
#       --version 1 \
#       --type uri_file \
#       --description "Synthetic QC anomaly dataset for LabCermat hackathon" \
#       --path azureml://jobs/shy_steelpan_qcl349kpr2/outputs/dataset_dir/qc_synthetic.csv \
#       --resource-group rg-labcermat-ml-eastasia \
#       --workspace-name mlw-labcermat
#
# CATATAN:
#   - File CSV tidak boleh di-commit ke repository (.gitignore sudah mencakup ml/data/*.csv)
#   - Data Asset yang sudah ter-register bisa di-refer dari training_job.yml
#     menggunakan: azureml:qc-anomaly-synthetic@latest
#   - Versi baru dapat diregister ulang dengan --version 2, dst.
#
# VERIFY setelah register:
#
#     az ml data show \
#       --name qc-anomaly-synthetic \
#       --version 1 \
#       --resource-group rg-labcermat-ml-eastasia \
#       --workspace-name mlw-labcermat

$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json

name: qc-anomaly-synthetic
version: "1"
type: uri_file
description: >
  Synthetic QC anomaly dataset for LabCermat Sprint 7 hackathon.
  10 000 rows, 16 features + 1 label (0=stabil, 1=perlu_perhatian, 2=potensi_drift).
  Label distribution: ~60% stabil, ~30% perlu_perhatian, ~10% potensi_drift.
  Generated by ml/data/generate_dataset.py with random_state=42.
  Source: Azure ML job shy_steelpan_qcl349kpr2.

# path diisi saat register via CLI (--path flag).
# Jangan hardcode path lokal di sini karena file CSV tidak di-commit.
# path: <diisi via --path flag saat az ml data create>
