# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - backend-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/backend && pnpm exec prisma generate

      - name: Build backend
        run: cd apps/backend && pnpm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r apps/backend/dist deploy/dist
          cp apps/backend/package.json deploy/package.json
          cp apps/backend/prisma deploy/prisma -r
          # generate package-lock.json for Azure npm install
          cd deploy && npm install --package-lock-only --legacy-peer-deps

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_71458D3BA3EE43E8801C4849248FE648 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FACF0B275F9C42E29D360EBBEBE3D8B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_06DE9D90D89148DA9B670DA262A5FECB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-service'
          slot-name: 'Production'
          package: .
